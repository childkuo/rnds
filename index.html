<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>英文課文伴讀</title>
  
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 pb-20">

  <!-- 全域外放音訊播放器 -->
  <audio id="globalAudioPlayer" playsinline preload="auto"></audio>

  <!-- 頂部導覽列：你的專屬書法 Logo -->
  <header class="bg-white p-3 shadow-sm sticky top-0 z-10 flex items-center justify-center gap-2.5 font-bold text-lg text-slate-800">
    <img src="logo.png" alt="Logo" class="h-9 w-auto object-contain inline-block">
    <span>拍照學英語</span>
  </header>

  <!-- iPhone 靜音開關提醒 -->
  <div class="max-w-md mx-auto px-4 pt-3">
    <div class="bg-amber-100 border-l-4 border-amber-500 text-amber-900 p-2.5 rounded text-xs flex items-center gap-2 shadow-sm">
      <span class="text-base">🔔</span>
      <span><strong>提示：</strong>若喇叭無聲，請確認 iPhone 機身左側<strong>靜音開關已關閉（非橘色）</strong>，並按側邊鍵將音量調大。</span>
    </div>
  </div>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- 雙功能上傳區 -->
    <div class="bg-white p-5 rounded-2xl shadow-sm text-center border-2 border-dashed border-amber-300 space-y-3">
      <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
      <input type="file" id="albumInput" accept="image/*" class="hidden">

      <div class="grid grid-cols-2 gap-2">
        <button onclick="document.getElementById('cameraInput').click()" class="py-3.5 bg-amber-500 hover:bg-amber-600 active:scale-95 transition text-white font-bold rounded-xl shadow flex items-center justify-center gap-1.5 text-sm">
          📷 即時拍照
        </button>
        <button onclick="document.getElementById('albumInput').click()" class="py-3.5 bg-blue-500 hover:bg-blue-600 active:scale-95 transition text-white font-bold rounded-xl shadow flex items-center justify-center gap-1.5 text-sm">
          🖼️ 從相簿選取
        </button>
      </div>
      <p id="statusText" class="text-xs text-gray-400">已啟用「表格線條、圖形雜訊自動排除」</p>
    </div>

    <!-- 載入指示 -->
    <div id="loading" class="hidden text-center py-6">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent"></div>
      <p id="progressText" class="text-sm text-amber-700 mt-2 font-medium">圖片優化與降噪中...</p>
    </div>

    <!-- 課文卡片清單展示區 -->
    <div id="resultsContainer" class="space-y-4"></div>
  </main>

  <script>
    window.parsedLessons = [];
    const audioPlayer = document.getElementById('globalAudioPlayer');

    document.getElementById('cameraInput').addEventListener('change', handleImageUpload);
    document.getElementById('albumInput').addEventListener('change', handleImageUpload);

    async function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const loading = document.getElementById('loading');
      const progressText = document.getElementById('progressText');
      const container = document.getElementById('resultsContainer');
      
      loading.classList.remove('hidden');
      container.innerHTML = '';
      window.parsedLessons = [];
      progressText.innerText = "圖片降噪與字體強化中...";

      try {
        const processedImageBase64 = await preprocessImage(file);
        progressText.innerText = "文字辨識中 (約需 2~3 秒)...";

        const worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,?!\'"- ',
        });

        const ret = await worker.recognize(processedImageBase64);
        await worker.terminate();

        progressText.innerText = "正在自動過濾表格、圖形與雜訊...";

        // 核心調用：過濾表格、雜質符號與圖形噪點，提取真正課文
        const validSentences = extractValidEnglishSentences(ret.data.text);

        if (validSentences.length === 0) {
          alert('未能識別出足夠完整的英文課文句子，請避開插圖，拍得更近更清晰！');
          return;
        }

        progressText.innerText = "正在拆解意群與翻譯課文...";

        for (let i = 0; i < validSentences.length; i++) {
          await processSentenceCard(validSentences[i], i);
        }

      } catch (err) {
        alert('解析發生錯誤：' + err.message);
      } finally {
        loading.classList.add('hidden');
        e.target.value = '';
      }
    }

    // Canvas 影像預處理：提升對比度
    function preprocessImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          let w = img.width, h = img.height;
          const maxDim = 1400;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          canvas.width = w; canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);

          const imgData = ctx.getImageData(0, 0, w, h);
          const d = imgData.data;
          for (let i = 0; i < d.length; i += 4) {
            const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
            const val = gray > 135 ? 255 : (gray < 80 ? 0 : gray);
            d[i] = val; d[i+1] = val; d[i+2] = val;
          }
          ctx.putImageData(imgData, 0, 0);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = URL.createObjectURL(file);
      });
    }

    // ⭐ 核心新技術：智能排除表格、幾何圖形雜訊與非英文亂碼
    function extractValidEnglishSentences(rawText) {
      // 1. 去除斷詞連字號，並按段落或換行分組
      let clean = rawText
        .replace(/([a-z])- (\n)?([a-z])/gi, '$1$3')
        .replace(/[|_+~`^\\<>{}\[\]=]/g, ' '); // 將表格線與特殊符號替換為空格

      // 2. 切分為潛在句子
      const candidates = clean
        .split(/(?<=[.?!])\s+|\n+/)
        .map(s => s.trim())
        .filter(s => s.length > 0);

      const validList = [];

      for (let str of candidates) {
        // 規則 A：過濾掉連續破折號、底線等表格邊框
        if (/^[-—_.=\s]+$/.test(str)) continue;

        // 規則 B：純數字、頁碼（例如 "Page 23"、"12"）直接排除
        if (/^(page\s*)?\d+$/i.test(str)) continue;

        // 規則 C：檢驗字母密度（英文字母必須佔總長度的 65% 以上，防止圖形噪點）
        const letterCount = (str.match(/[a-zA-Z]/g) || []).length;
        if (letterCount / str.length < 0.65) continue;

        // 規則 D：單詞數量檢驗（一句有效課文至少需要 3 個英文單字）
        const words = str.split(/\s+/).filter(w => /[a-zA-Z]{2,}/.test(w));
        if (words.length < 3) continue;

        // 整理空格與多餘標點
        const finalized = str.replace(/\s+/g, ' ').trim();
        validList.push(finalized);
      }

      return validList;
    }

    const CHUNK_SPLITTERS = [
      'in front of', 'next to', 'because of', 'as well as',
      'in', 'on', 'at', 'under', 'with', 'for', 'to', 'from',
      'and', 'but', 'or', 'so', 'because', 'before', 'after'
    ];

    async function processSentenceCard(sentence, index) {
      const container = document.getElementById('resultsContainer');
      const chunks = splitIntoChunks(sentence);
      
      const translation = await robustTranslate(sentence);
      const grammarTip = analyzeGrammar(sentence);

      const chunkPromises = chunks.map(async c => {
        const trans = await robustTranslate(c);
        return { en: c, zh: trans };
      });
      const chunkResults = await Promise.all(chunkPromises);

      window.parsedLessons[index] = {
        original: sentence,
        translation: translation,
        chunks: chunkResults,
        grammar: grammarTip
      };

      const card = document.createElement('div');
      card.id = `card-${index}`;
      card.className = "bg-white p-4 rounded-xl shadow-sm border border-orange-100 space-y-3 transition-all";

      const chunksHtml = chunkResults.map(c => `
        <div onclick="speakSpecificText('${c.en.replace(/'/g, "\\'")}')" class="inline-flex flex-col items-center bg-amber-50 active:bg-amber-100 rounded-lg p-2 border border-amber-200 text-center cursor-pointer">
          <span class="font-bold text-gray-800 text-sm">${c.en}</span>
          <span class="text-xs text-red-500 mt-0.5">${c.zh}</span>
        </div>
      `).join('');

      card.innerHTML = `
        <div onclick="playSmartAudio(${index}, 1.0)" class="cursor-pointer active:opacity-75">
          <div class="text-base font-semibold text-slate-800 leading-snug flex items-start justify-between gap-1">
            <span>${sentence}</span>
            <span class="text-blue-500 text-xs mt-1 shrink-0">🔊 點句發音</span>
          </div>
          <div class="text-xs text-gray-500 mt-1">${translation}</div>
        </div>

        <div class="flex flex-wrap gap-1.5 py-1">
          ${chunksHtml}
        </div>

        <div class="bg-slate-50 p-2.5 rounded-lg text-xs text-slate-600 border-l-4 border-amber-400">
          <span class="font-bold text-amber-700">語法重點：</span>${grammarTip}
        </div>

        <div class="flex gap-2 pt-1 border-t border-gray-100 text-xs">
          <button id="btn-play-${index}" onclick="playSmartAudio(${index}, 1.0)" class="flex-1 py-2.5 bg-blue-50 text-blue-600 active:bg-blue-200 rounded-lg font-medium flex items-center justify-center gap-1">
            🔊 喇叭朗讀
          </button>
          <button id="btn-slow-${index}" onclick="playSmartAudio(${index}, 0.7)" class="flex-1 py-2.5 bg-blue-50 text-blue-600 active:bg-blue-200 rounded-lg font-medium flex items-center justify-center gap-1">
            🐢 慢速
          </button>
          <button onclick="recordAndAssess(${index})" class="flex-1 py-2.5 bg-green-50 text-green-600 active:bg-green-200 rounded-lg font-medium flex items-center justify-center gap-1">
            🎤 跟讀
          </button>
        </div>
        <div id="feedback-${index}" class="text-xs text-center font-bold hidden py-1"></div>
      `;

      container.appendChild(card);
    }

    function splitIntoChunks(text) {
      let parts = [text];
      CHUNK_SPLITTERS.forEach(splitter => {
        let newParts = [];
        parts.forEach(p => {
          const regex = new RegExp(`\\b(${splitter})\\b`, 'gi');
          const split = p.split(regex);
          if (split.length > 1) {
            for (let i = 0; i < split.length; i++) {
              if (split[i].trim()) newParts.push(split[i].trim());
            }
          } else {
            newParts.push(p);
          }
        });
        parts = newParts;
      });
      return parts.length > 1 ? parts : [text];
    }

    // 雙通道翻譯
    async function robustTranslate(text) {
      if (!text || text.trim().length === 0) return '';
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(text.trim())}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && data[0]) return data[0].map(item => item[0]).join('');
        }
      } catch (e) {}

      try {
        const mail = `edu_${Math.floor(Math.random()*10000)}@gmail.com`;
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh-TW&de=${mail}`);
        const data = await res.json();
        const t = data.responseData?.translatedText;
        if (t && !t.includes('MYMEMORY WARNING')) return t;
      } catch (e) {}

      return '翻譯讀取中';
    }

    function analyzeGrammar(s) {
      const lower = s.toLowerCase();
      if (/\b(went|visited|saw|had|did|was|were|played|bought|found|came|got)\b/.test(lower) || /\b[a-z]{3,}ed\b/.test(lower)) {
        return "【一般過去時】使用了過去式動詞，用來敘述日記、過去經歷或發生的事情。";
      } else if (/there (is|are|was|were)/.test(lower)) {
        return "【There be 句型】表示『某處存在某物』。";
      } else if (/^(don't|please|hurry|let's|listen)\b/.test(lower)) {
        return "【祈使句】省略主語，用於提出號召、請求或催促。";
      } else if (/(can|can't|must|should|may)\b/.test(lower)) {
        return "【情態動詞】後接動詞原形，表達能力或義務。";
      } else if (/(have|has) (been|[a-z]+ed)/.test(lower)) {
        return "【完成時態】表示過去動作對現在造成的狀態或影響。";
      }
      return "【陳述句】標準的主謂賓敘述結構，適合日常語感積累。";
    }

    // 發音播放
    function playSmartAudio(index, rate = 1.0) {
      const item = window.parsedLessons[index];
      if (!item) return;
      speakSpecificText(item.original, rate, index);
    }

    function speakSpecificText(text, rate = 1.0, index = null) {
      const card = index !== null ? document.getElementById(`card-${index}`) : null;
      const btn = index !== null ? document.getElementById(rate < 1 ? `btn-slow-${index}` : `btn-play-${index}`) : null;
      const originalText = rate < 1 ? "🐢 慢速" : "🔊 喇叭朗讀";

      if (card) card.classList.add('ring-2', 'ring-blue-400');
      if (btn) btn.innerText = "🔊 播放中...";

      const resetUI = () => {
        if (card) card.classList.remove('ring-2', 'ring-blue-400');
        if (btn) btn.innerText = originalText;
      };

      const pollyUrl = `https://api.streamelements.com/kappa/v2/speech?voice=Joanna&text=${encodeURIComponent(text)}`;

      audioPlayer.src = pollyUrl;
      audioPlayer.playbackRate = rate;

      audioPlayer.onended = resetUI;
      audioPlayer.onerror = () => {
        const googleUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encodeURIComponent(text)}`;
        audioPlayer.src = googleUrl;
        audioPlayer.play().catch(() => {
          nativeFallback(text, rate, resetUI);
        });
      };

      audioPlayer.play().catch(() => {
        nativeFallback(text, rate, resetUI);
      });
    }

    function nativeFallback(text, rate, callback) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = rate;
        u.onend = callback;
        u.onerror = callback;
        window.speechSynthesis.speak(u);
      } else {
        if (callback) callback();
      }
    }

    // 跟讀評測
    function recordAndAssess(index) {
      const item = window.parsedLessons[index];
      if (!item) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('請在 iPhone Safari 上使用！');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      const feedback = document.getElementById(`feedback-${index}`);
      feedback.className = "text-xs text-center font-bold py-1 text-amber-500 block";
      feedback.innerText = "請開始朗讀句子...";
      recognition.start();

      recognition.onresult = function(event) {
        const spoken = event.results[0][0].transcript;
        const cleanSpoken = spoken.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
        const cleanTarget = item.original.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();

        if (cleanSpoken === cleanTarget) {
          feedback.className = "text-xs text-center font-bold py-1 text-green-600 block";
          feedback.innerText = `太棒了！完全正確 👍`;
        } else {
          feedback.className = "text-xs text-center font-bold py-1 text-red-500 block";
          feedback.innerText = `辨識為: "${spoken}"，再試一次！`;
        }
      };

      recognition.onerror = function() {
        feedback.className = "text-xs text-center font-bold py-1 text-gray-400 block";
        feedback.innerText = "沒聽清楚，請點擊重試";
      };
    }
  </script>
</body>
</html>
